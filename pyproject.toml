[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "rrlab-bench"
version = "0.3.0"
description = "RRLabBench — Agent Capability Audit: measure efficiency, regression risk, and context degradation"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Rodney Rui", email = "rodneyrui@gmail.com"}]
keywords = ["llm", "benchmark", "agent", "audit", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
rrlab-bench = "src.cli:main"

[project.urls]
Homepage = "https://github.com/rodneyrui/rrlab-bench"
Repository = "https://github.com/rodneyrui/rrlab-bench"

[tool.setuptools.packages.find]
where = ["src"]
